name: Build Debug APK

on:
  push:
    paths:
      - "vibemod/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "vibemod/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibemod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Prepare downloadable APK name
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/VibeMod-android-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeMod-android-debug
          path: dist/VibeMod-android-debug.apk
          if-no-files-found: error
          retention-days: 90
