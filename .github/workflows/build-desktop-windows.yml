name: Build VibeMod Desktop

on:
  push:
    paths:
      - "vibemod-desktop/**"
      - ".github/workflows/build-desktop-windows.yml"
  pull_request:
    paths:
      - "vibemod-desktop/**"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vibemod-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        run: .\gradlew.bat test --stacktrace
      - name: Package Windows EXE / MSI
        run: .\gradlew.bat packageExe packageMsi --stacktrace
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: VibeMod-windows
          path: |
            vibemod-desktop/build/compose/binaries/main/exe/**
            vibemod-desktop/build/compose/binaries/main/msi/**

  linux-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibemod-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests + compile
        run: |
          chmod +x gradlew
          ./gradlew test compileKotlin --stacktrace
